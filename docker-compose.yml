# 一条命令部署：docker compose up -d
# 浏览器访问 http://127.0.0.1:3080
services:
  workbench:
    build: .
    image: icpc-workbench:local
    container_name: icpc-workbench
    ports:
      # 默认只绑宿主机回环：应用本身无认证，暴露到局域网等同公开你的练习数据
      # 与 AI API Key。确认要局域网访问时改为 "3080:3001"，并自行加反代 + 认证。
      - "127.0.0.1:3080:3001"
    volumes:
      # 全部运行时数据（数据库/上传/知识点/备份）都在这一卷里
      - icpc-data:/app/server/data
      # 可选：挂载自定义配置（端口/AI 配置等），参考 server/config.example.json
      # - ./server/config.json:/app/server/config.json:ro
    environment:
      # AI 也可改在应用「设置」页里配置（随数据卷持久化）
      # AI_API_KEY: sk-xxx
      # SEARCH_API_KEY: tvly-xxx
      TZ: Asia/Shanghai
    restart: unless-stopped
    # 日志轮转：长期运行的容器不轮转会让 json-file 日志无限增长（同步/备份/AI 调用都会打日志），
    # 最终写满宿主机磁盘。单文件 10 MB × 3 份 = 最多 30 MB，超出后自动滚动丢弃最旧的一份。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # docker stop 的默认宽限期是 10 秒；应用内的优雅退出最多等 5 秒（见 sea.ts 的
    # installShutdown），留出余量让 SQLite 关库与 WAL checkpoint 走完再 SIGKILL
    stop_grace_period: 10s

volumes:
  icpc-data:
