# Docker 镜像构建发布：push master → ghcr.io 的 nightly 标签；push v* tag → latest + 版本标签。
# 预构建镜像让用户的部署收敛为一条 docker run（见 README「Docker 部署」章节），
# 不需要克隆仓库本地构建；数据通过挂卷 /app/server/data 持久化。
# 门禁：与 nightly-desktop.yml 同源——跨 workflow `needs` 不支持，内联同一组命令作前置 job，
# 防止在测试失败的提交上把坏镜像推成 nightly/latest。
# 多架构：linux/amd64 + linux/arm64（prepare-typst.mjs 自带 linux-arm64 musl 资产表，
# node/tsx/esbuild 均有 arm64 支持，无需额外适配）。
name: Docker 镜像发布（ghcr.io）

on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Lint (client)
        run: npm run lint

      - name: Test (server + client)
        run: npm test

  build-push:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签规则：
      #   push master      → nightly
      #   push v0.5.1 tag  → 0.5.1、0.5、latest
      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
