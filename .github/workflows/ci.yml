name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Lint (client + server)
        run: npm run lint

      - name: Theme token consistency (client)
        run: npm run check:tokens -w client

      - name: Test (server + client)
        run: npm test

  windows-preview:
    name: Windows PR 安装包
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建 Windows 安装包与便携版
        run: node server/scripts/build-desktop.mjs

      # 桌面壳回归守卫（issue #66）：探活/凭据桥的回环 HTTP 客户端必须 .no_proxy()。
      #
      # 为什么不在 CI 里 cargo test：本 crate 的 build.rs 会 embed-resource 编译
      # windows-app.manifest 并要求 tauri 的 binaries/icpc-core-<triple>.exe 就位，
      # 在干净 runner 上会先失败在 rc.exe（RC2135 / resource path 不存在），
      # 与测试断言无关；而真正的断言测试在开发机上可用 cargo test 跑。
      # 这里只做**零构建依赖**的静态守卫：删掉 .no_proxy() 就会红。
      - name: 校验回环 HTTP 客户端禁用系统代理（issue #66）
        shell: pwsh
        run: |
          $files = @(
            'desktop/app/src-tauri/src/discovery.rs',
            'desktop/app/src-tauri/src/shell_auth.rs'
          )
          $bad = @()
          foreach ($f in $files) {
            $text = Get-Content -LiteralPath $f -Raw
            # 每个文件都必须出现 .no_proxy()（客户端构建处）
            if ($text -notmatch '\.no_proxy\(\)') {
              $bad += "$f 缺少 .no_proxy()：回环请求会被系统代理接管（issue #66）"
            }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host '回环 HTTP 客户端已禁用系统代理',


      - name: 附带许可和更新说明
        shell: pwsh
        run: |
          Copy-Item -LiteralPath LICENSE -Destination server/release/LICENSE
          # 取 docs/updates 里**最新一份**更新说明，而不是写死某个 PR 的文件名。
          # 写死时：该文件一旦改名/删除，Actions 的 pwsh 默认 $ErrorActionPreference='Stop'
          # 会让这一步直接红；而且这个 job 是常驻的（if: pull_request），
          # 之后每个 PR 的测试包都会附上这份过期的更新说明。
          $note = Get-ChildItem -Path docs/updates -Filter *.md -File |
            Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $note) {
            Write-Host 'docs/updates 下没有更新说明，跳过（不阻塞打包）'
          } else {
            Copy-Item -LiteralPath $note.FullName -Destination server/release/更新说明.md
            Write-Host "更新说明：$($note.Name)"
          }

      - name: 校验 MSVC 静态 WebView2 Loader
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('server/release/icpc-workbench.exe')
          if ([Text.Encoding]::ASCII.GetString($bytes) -match 'WebView2Loader\.dll') {
            throw '壳依赖外部 WebView2Loader.dll，不能作为安装包分发'
          }

      - name: 生成 SHA256 校验文件
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath server/release -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath server/release/checksums.sha256 -Encoding utf8

      - name: 上传 PR 测试安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            server/release/icpc-workbench.exe
            server/release/icpc-core.exe
            server/release/*-setup.exe
            server/release/使用说明.txt
            server/release/更新说明.md
            server/release/LICENSE
            server/release/checksums.sha256
          if-no-files-found: error
          retention-days: 14
