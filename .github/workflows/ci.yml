name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Lint (client + server)
        run: npm run lint

      - name: Theme token consistency (client)
        run: npm run check:tokens -w client

      - name: Test (server + client)
        run: npm test

  windows-preview:
    name: Windows PR 安装包
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建 Windows 安装包与便携版
        run: node server/scripts/build-desktop.mjs

      - name: 附带许可和更新说明
        shell: pwsh
        run: |
          Copy-Item -LiteralPath LICENSE -Destination server/release/LICENSE
          Copy-Item -LiteralPath docs/updates/2026-10-30-desktop-review-sync.md -Destination server/release/更新说明.md

      - name: 校验 MSVC 静态 WebView2 Loader
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('server/release/icpc-workbench.exe')
          if ([Text.Encoding]::ASCII.GetString($bytes) -match 'WebView2Loader\.dll') {
            throw '壳依赖外部 WebView2Loader.dll，不能作为安装包分发'
          }

      - name: 生成 SHA256 校验文件
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath server/release -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath server/release/checksums.sha256 -Encoding utf8

      - name: 上传 PR 测试安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            server/release/icpc-workbench.exe
            server/release/icpc-core.exe
            server/release/*-setup.exe
            server/release/使用说明.txt
            server/release/更新说明.md
            server/release/LICENSE
            server/release/checksums.sha256
          if-no-files-found: error
          retention-days: 14
