# 桌面版 nightly 自动构建：每次 push 到 master 构建全平台安装包并发布/覆盖 nightly 预发布版。
# 应用内「检查更新」会把它作为提交通道，感知未打 tag 的新提交并支持一键更新（Windows）。
# 门禁：build/publish 均 `needs` 复用 ci.yml 的 check job（同一 workflow 调用）。
# 两个 workflow 由同一 push 事件并行触发，若不显式依赖，master 上测试失败也会照常构建
# 并覆盖 nightly 预发布版，用户拉到的可能是坏包。
# 平台覆盖：
#   - Windows：NSIS 安装程序 + 便携版双 exe
#   - macOS（Apple Silicon）：.dmg 安装镜像（构建脚本内 ad-hoc 签名并校验，签名失败即构建失败；
#     未公证，首开可能需右键打开或「仍要打开」，见 release notes）
name: 桌面版 nightly 构建

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-desktop
  cancel-in-progress: false

jobs:
  # 质量门禁：与 ci.yml 的 check job 同源（typecheck / lint / test）。
  # 跨 workflow 的 `needs` 不受支持，故此处内联同一组命令作为本 workflow 的前置 job。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Lint (client)
        run: npm run lint

      - name: Test (server + client)
        run: npm test

  build-windows:
    needs: [gate]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # APP_VERSION 取最近 tag、注入构建 commit，需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建桌面版（核心 SEA + Tauri 壳 + NSIS 安装程序）
        run: node server/scripts/build-desktop.mjs

      # 桌面壳回归守卫（issue #66）：探活/凭据桥的回环 HTTP 客户端必须 .no_proxy()。
      # 上一版正是因为 CI 对 Rust 侧零覆盖，探活被系统代理拦截一路进了发布版。
      # 不在 CI 里 cargo test 的原因见 ci.yml 同名步骤的说明（build.rs 需要
      # windows-app.manifest 与 binaries/icpc-core-* 就位，干净 runner 上会先失败）。
      - name: 校验回环 HTTP 客户端禁用系统代理（issue #66）
        shell: pwsh
        run: |
          $files = @(
            'desktop/app/src-tauri/src/discovery.rs',
            'desktop/app/src-tauri/src/shell_auth.rs'
          )
          $bad = @()
          foreach ($f in $files) {
            $text = Get-Content -LiteralPath $f -Raw
            if ($text -notmatch '\.no_proxy\(\)') {
              $bad += "$f 缺少 .no_proxy()：回环请求会被系统代理接管（issue #66）"
            }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host '回环 HTTP 客户端已禁用系统代理'

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            server/release/icpc-workbench.exe
            server/release/icpc-core.exe
            server/release/*-setup.exe
          if-no-files-found: error

  build-mac:
    needs: [gate]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建 macOS 桌面版（核心 SEA + Tauri 壳 + .app/.dmg，Apple Silicon）
        run: node server/scripts/build-desktop-mac.mjs

      # 回归门禁（issue #14：mac 版核心崩溃就出在这里）：
      # SEA blob 必须落在 Mach-O 的 NODE_SEA 段；落到 postject 默认的 __POSTJECT 段，
      # Node 按官方约定找不到 blob，启动即崩（EXC_BAD_ACCESS / SIGSEGV）。
      # 同时确认注入后的核心与 .app 仍处于有效签名状态。
      - name: 校验 SEA 注入段与签名
        run: |
          set -e
          APP="desktop/app/src-tauri/target/release/bundle/macos/icpc-workbench.app"
          CORE="$APP/Contents/MacOS/icpc-core"
          echo "== $CORE 的 segment/section =="
          otool -l "$CORE" | grep -E 'segname|sectname' | sort -u
          if ! otool -l "$CORE" | grep -q 'segname NODE_SEA'; then
            echo "::error::SEA blob 不在 NODE_SEA 段：postject 少了 --macho-segment-name NODE_SEA，mac 版核心会启动即崩"
            exit 1
          fi
          if otool -l "$CORE" | grep -q 'segname __POSTJECT'; then
            echo "::error::SEA blob 落进了默认的 __POSTJECT 段，Node 找不到它"
            exit 1
          fi
          echo "== codesign =="
          codesign -dv --verbose=2 "$CORE" 2>&1 | grep -E 'Signature|Identifier' || true
          codesign --verify --verbose=2 "$CORE"
          codesign --verify --deep --verbose=2 "$APP"
          echo "SEA 段与签名校验通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            server/release/*.dmg
            server/release/icpc-core-*
            server/release/README-mac.txt
          if-no-files-found: error

  publish:
    needs: [gate, build-windows, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh release 需要 git 仓库上下文解析 remote 与 --target 提交
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: server/release
          merge-multiple: true

      - name: 生成 SHA256 校验文件
        run: |
          cd server/release
          ls -la
          sha256sum icpc-workbench.exe icpc-core.exe *-setup.exe *.dmg icpc-core-* README-mac.txt > checksums.sha256
          cat checksums.sha256

      - name: 发布 nightly 预发布版（在位覆盖，避免删除重建造成检查/下载 404 窗口）
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          SHORT="${SHA::7}"
          DATE=$(date +%Y-%m-%d)
          TITLE="nightly · $SHORT · $DATE"
          NOTES="master 分支提交 ${SHORT} 的自动构建（开发版，稳定性低于正式发布版）。
          - Windows：icpc-workbench-<版本>-x64-setup.exe 安装程序，或便携版双 exe；支持应用内一键更新
          - macOS（Apple Silicon M 系列）：*.dmg 安装镜像，ad-hoc 已签名（构建脚本强制签名并校验，签名不过不出包）。未公证，首次打开如提示「无法验证开发者/已损坏」：右键 →「打开」，或「系统设置 → 隐私与安全性 → 仍要打开」，或终端 xattr -cr /Applications/icpc-workbench.app。数据在 ~/Library/Application Support/icpc-workbench/data，覆盖安装不丢。暂不支持 Intel Mac 与应用内一键更新，更新请手动下载覆盖"
          ASSETS="server/release/icpc-workbench.exe server/release/icpc-core.exe server/release/*-setup.exe server/release/*.dmg server/release/icpc-core-* server/release/README-mac.txt"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --target "$SHA" --title "$TITLE" --notes "$NOTES"
            # exe 先行、checksums 最后上传：应用内更新先取校验文件再下载产物，
            # 尽量缩短「新产物 + 旧校验文件」短暂不一致的窗口（校验不过会自动重试）
            gh release upload nightly --clobber $ASSETS
            gh release upload nightly --clobber server/release/checksums.sha256
          else
            gh release create nightly \
              --prerelease \
              --target "$SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              $ASSETS \
              server/release/checksums.sha256
          fi
